<!doctype html>
<!-- A fake Windows desktop that hosts the real Mixdeck UI (mocked backend) in iframes, for the demo video. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { background: radial-gradient(1200px 700px at 25% 15%, #2d4a7a 0%, #1a2238 45%, #0f121c 100%); }
  .glow { position: absolute; inset: 0; background: radial-gradient(600px 400px at 80% 70%, rgba(167,139,250,.25), transparent 70%); }
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: rgba(28,30,38,.86); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tb-app { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; }
  .tb-app i { width: 24px; height: 24px; border-radius: 6px; display: block; }
  .tray { position: absolute; right: 12px; top: 0; bottom: 0; display: flex; align-items: center; gap: 10px; color: #e8eaee; font-size: 12px; }
  .tray .icon { width: 32px; height: 32px; border-radius: 5px; display: grid; place-items: center; }
  .tray .icon.hot { background: rgba(255,255,255,.12); }
  .tray .clock { text-align: right; line-height: 1.25; padding: 0 6px; }
  .mx { width: 18px; height: 18px; border-radius: 5px; background: conic-gradient(from 200deg, #60cdff, #a78bfa, #f472b6, #60cdff); }
  iframe { position: absolute; border: 0; background: transparent; border-radius: 8px; box-shadow: 0 16px 48px rgba(0,0,0,.45);
    transition: opacity .18s ease, transform .18s ease; }
  #flyout { right: 12px; width: 380px; opacity: 0; transform: translateY(16px); pointer-events: none; }
  #flyout.show { opacity: 1; transform: none; pointer-events: auto; }
  #osd { left: 490px; bottom: 96px; width: 300px; height: 72px; opacity: 0; transform: scale(.96); }
  #osd.show { opacity: 1; transform: none; }
  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; z-index: 50; pointer-events: none; transform: translate(640px, 360px);
    transition: transform .35s cubic-bezier(.3,.7,.3,1); filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  #cursor.instant { transition: none; }
  #cursor .ring { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #60cdff; opacity: 0; }
  #cursor.click .ring { animation: ring .4s ease-out; }
  @keyframes ring { from { opacity: 1; transform: scale(.4); } to { opacity: 0; transform: scale(2); } }
  #caption { position: absolute; left: 40px; top: 36px; max-width: 640px; z-index: 40; color: #fff; transition: opacity .25s; }
  #caption .step { font: 600 13px/1 "Segoe UI", system-ui; letter-spacing: .08em; text-transform: uppercase; color: #99dcff; margin-bottom: 10px; }
  #caption .text { font: 600 34px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui; text-shadow: 0 2px 18px rgba(0,0,0,.4); }
  #caption .sub { margin-top: 10px; font-size: 17px; color: #c9d3e4; line-height: 1.45; }
  #keys { position: absolute; left: 700px; top: 300px; display: flex; gap: 8px; opacity: 0; transition: opacity .2s; z-index: 30; }
  #keys.show { opacity: 1; }
  #keys span { font: 600 22px "Segoe UI", system-ui; color: #fff; padding: 10px 16px; border-radius: 10px; background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25); box-shadow: 0 4px 0 rgba(255,255,255,.12); }
  #keys span.down { transform: translateY(3px); box-shadow: 0 1px 0 rgba(255,255,255,.12); }
  .window { position: absolute; left: 60px; top: 170px; width: 560px; height: 330px; border-radius: 10px; background: rgba(32,34,42,.9);
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 20px 60px rgba(0,0,0,.4); color: #cfd6e4; overflow: hidden; opacity: 0; transition: opacity .3s; }
  .window.show { opacity: 1; }
  .window .bar { height: 34px; display: flex; align-items: center; padding: 0 12px; gap: 8px; background: rgba(255,255,255,.04); font-size: 12px; }
  .window .art { margin: 26px; height: 200px; border-radius: 8px; background: linear-gradient(135deg, #1db954, #116b33); display: grid; place-items: end start; padding: 16px; color: #fff; font: 600 22px "Segoe UI"; }
  #end { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: radial-gradient(900px 600px at 50% 40%, #243a63, #0e111a);
    color: #fff; opacity: 0; transition: opacity .5s; pointer-events: none; }
  #end.show { opacity: 1; }
  #end .logo { width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 22px; background: conic-gradient(from 200deg, #60cdff, #a78bfa, #f472b6, #60cdff); }
  #end h1 { margin: 0; font: 700 52px "Segoe UI Variable Display", "Segoe UI"; text-align: center; }
  #end p { margin: 12px 0 0; text-align: center; font-size: 20px; color: #c9d3e4; }
  #end code { display: inline-block; margin-top: 22px; font: 600 18px Consolas, monospace; color: #99dcff; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="window" id="music"><div class="bar">● ● ●&nbsp;&nbsp; Spotify</div><div class="art">Focus Flow · Playlist</div></div>
  <div id="caption"><div class="step"></div><div class="text"></div><div class="sub"></div></div>
  <div id="keys"><span>Ctrl</span><span>Alt</span><span id="k3">↓</span></div>

  <iframe id="flyout" src="/?demo"></iframe>
  <iframe id="osd" src="/?demo#osd"></iframe>

  <div class="taskbar">
    <div class="tb-app"><i style="background:linear-gradient(135deg,#60cdff,#0067c0)"></i></div>
    <div class="tb-app"><i style="background:linear-gradient(135deg,#ffd54a,#f0a500)"></i></div>
    <div class="tb-app"><i style="background:#1a73e8"></i></div>
    <div class="tb-app"><i style="background:#1db954"></i></div>
    <div class="tb-app"><i style="background:#5865f2"></i></div>
    <div class="tray">
      <div class="icon" id="trayicon"><span class="mx"></span></div>
      <div>📶&nbsp;&nbsp;🔊</div>
      <div class="clock">10:42<br />26/11/2026</div>
    </div>
  </div>

  <div id="cursor"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 2l7.5 19 2.6-7.9L21 10.5z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg><span class="ring"></span></div>

  <div id="end"><div><div class="logo"></div><h1>Mixdeck</h1><p>Every app and every browser tab, one tray mixer.</p>
    <p><code>github.com/wishnuat/mixdeck</code></p></div></div>

<script>
  // Keep the flyout iframe bottom-anchored above the taskbar and sized to its content, like the real window.
  const fly = document.getElementById("flyout");
  setInterval(() => {
    try {
      const el = fly.contentDocument && fly.contentDocument.querySelector(".flyout");
      if (!el) return;
      const h = Math.ceil(el.getBoundingClientRect().height);
      fly.style.height = h + "px";
      fly.style.top = (800 - 48 - 12 - h) + "px";
    } catch {}
  }, 50);
  window.caption = (step, text, sub) => {
    const c = document.getElementById("caption");
    c.style.opacity = 0;
    setTimeout(() => {
      c.querySelector(".step").textContent = step || "";
      c.querySelector(".text").textContent = text || "";
      c.querySelector(".sub").textContent = sub || "";
      c.style.opacity = text ? 1 : 0;
    }, 220);
  };
  window.cursorTo = (x, y, instant) => {
    const c = document.getElementById("cursor");
    c.classList.toggle("instant", !!instant);
    c.style.transform = `translate(${x}px, ${y}px)`;
  };
  window.cursorClick = () => {
    const c = document.getElementById("cursor");
    c.classList.remove("click"); void c.offsetWidth; c.classList.add("click");
  };
</script>
</body>
</html>
