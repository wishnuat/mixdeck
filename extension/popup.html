<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; --accent: #005fb8; --muted: #666; --card: #f3f3f5; --line: rgba(0,0,0,.08); }
      @media (prefers-color-scheme: dark) { :root { --accent: #60cdff; --muted: #a5a8b0; --card: #2b2b30; --line: rgba(255,255,255,.08); } }
      body { margin: 0; width: 320px; font: 13px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
      header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; font-weight: 600; font-size: 14px; }
      .logo { width: 16px; height: 16px; border-radius: 4px; background: conic-gradient(from 200deg, #60cdff, #a78bfa, #f472b6, #60cdff); }
      .status { margin-left: auto; font-weight: 400; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #999; }
      .dot.on { background: #16a34a; }
      ul { list-style: none; margin: 0; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 4px; }
      li { display: grid; grid-template-columns: 20px 1fr 34px; gap: 8px 10px; align-items: center; padding: 8px 10px; background: var(--card); border-radius: 8px; }
      li img, .fav { width: 16px; height: 16px; border-radius: 3px; }
      .fav { background: var(--line); }
      .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .host { color: var(--muted); font-size: 11px; }
      input[type=range] { grid-column: 1 / 3; width: 100%; accent-color: var(--accent); margin: 0; }
      .pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
      button.m { border: 0; background: none; cursor: pointer; font-size: 14px; padding: 0; color: inherit; }
      .empty { padding: 4px 16px 16px; color: var(--muted); line-height: 1.5; }
    </style>
  </head>
  <body>
    <header><span class="logo"></span>Tab volume <span class="status"><span class="dot" id="dot"></span><span id="st"></span></span></header>
    <ul id="list"></ul>
    <script src="popup.js"></script>
  </body>
</html>
